<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="栖乐荟购物中心位置示意图">
  <title>栖乐荟购物中心 · 学府街与博文路交会处</title>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8a7452" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#e9e1d0"/>

  <!-- city blocks -->
  <g fill="#ded3bd">
    <rect x="36" y="34" width="190" height="150" rx="6"/>
    <rect x="256" y="58" width="180" height="126" rx="6"/>
    <rect x="560" y="34" width="200" height="150" rx="6"/>
    <rect x="60" y="300" width="196" height="160" rx="6"/>
    <rect x="300" y="320" width="150" height="140" rx="6"/>
    <rect x="560" y="300" width="200" height="160" rx="6"/>
    <rect x="36" y="34" width="60" height="60" rx="4" fill="#d5c8ae"/>
    <rect x="700" y="330" width="60" height="60" rx="4" fill="#d5c8ae"/>
  </g>

  <!-- roads -->
  <rect x="484" y="0" width="34" height="500" fill="#faf5e9"/>
  <rect x="0" y="224" width="800" height="34" fill="#faf5e9"/>
  <g stroke="#d8c8a9" stroke-width="2" stroke-dasharray="10 10">
    <path d="M501 0 V500"/>
    <path d="M0 241 H800"/>
  </g>

  <!-- the mall -->
  <g filter="url(#soft)">
    <rect x="536" y="112" width="222" height="92" rx="5" fill="#cdb389" stroke="#a9713f" stroke-width="1.5"/>
    <rect x="548" y="124" width="198" height="68" fill="none" stroke="#8a5a33" stroke-width="1" stroke-dasharray="5 4" opacity=".7"/>
    <text x="647" y="156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#3d2517" letter-spacing="3">栖乐荟</text>
    <text x="647" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a3a22" letter-spacing="2">5F · 王氏手工皮艺</text>
  </g>

  <!-- pin -->
  <g transform="translate(647,222)">
    <path d="M0 0 C-13 -18 -18 -26 -18 -34 A18 18 0 1 1 18 -34 C18 -26 13 -18 0 0 Z" fill="#3d2517"/>
    <circle cx="0" cy="-34" r="6.5" fill="#f4eee2"/>
  </g>

  <!-- labels -->
  <text transform="translate(501,84) rotate(-90)" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7a6a52" letter-spacing="4">学 府 街</text>
  <text x="86" y="247" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7a6a52" letter-spacing="4">博 文 路</text>
  <text x="36" y="478" font-family="Georgia, serif" font-size="10" fill="#a08e72" letter-spacing="3">CHANGCHUN · HIGH-TECH ZONE · QILEHUI</text>

  <!-- compass -->
  <g transform="translate(756,452)" fill="#a08e72" font-family="Georgia, serif" font-size="10">
    <path d="M0 -16 L4 -2 L0 2 L-4 -2 Z" fill="#a08e72"/>
    <text x="0" y="14" text-anchor="middle">N</text>
  </g>
</svg>
